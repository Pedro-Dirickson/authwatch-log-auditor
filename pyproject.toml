[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authwatch"
version = "0.1.0"
description = "Lightweight CLI to detect brute force, user enumeration and off-hours logins in auth logs"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
